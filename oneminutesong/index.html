<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>One Minute Song</title>
    <meta name="description" content="Spin a prompt, then build a song loop in 60 seconds.">
    <link rel="icon" type="image/png" href="../imgs/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

    <header class="label">
        <h1>One Minute Song</h1>
        <p>Stage 3 preview: chords, synths, drums and a test loop.</p>
    </header>

    <section class="panel" aria-labelledby="key-h">
        <div class="panel-head">
            <h2 id="key-h">Key · <span id="key-label">C major</span></h2>
            <div class="seg" id="mode" role="radiogroup" aria-label="Mode">
                <button type="button" role="radio" data-mode="major" aria-checked="true">Major</button>
                <button type="button" role="radio" data-mode="minor" aria-checked="false">Minor</button>
            </div>
        </div>
        <div class="keys" id="keys" role="radiogroup" aria-label="Key"></div>
    </section>

    <section class="panel" aria-labelledby="palette-h">
        <div class="panel-head">
            <h2 id="palette-h">Chords</h2>
            <p class="hint">Tap to hear · hold or ⋯ for variants</p>
        </div>
        <div class="palette" id="palette" role="group" aria-label="Chord palette"></div>
    </section>

    <section class="panel" aria-labelledby="sound-h">
        <div class="panel-head">
            <h2 id="sound-h">Sound</h2>
        </div>
        <div class="synths" id="synths" role="radiogroup" aria-label="Chord sound"></div>
        <div class="knobs">
            <label class="knob" for="tempo">
                <span>Tempo <output id="tempo-out" for="tempo">100</output> BPM</span>
                <input type="range" id="tempo" min="70" max="160" step="1" value="100">
            </label>
            <label class="knob" for="reverb">
                <span>Reverb <output id="reverb-out" for="reverb">30%</output></span>
                <input type="range" id="reverb" min="0" max="100" step="1" value="30">
            </label>
            <label class="switch" for="bass">
                <input type="checkbox" id="bass" checked>
                <span>Bass</span>
            </label>
        </div>
    </section>

    <section class="panel" aria-labelledby="drums-h">
        <div class="panel-head">
            <h2 id="drums-h">Drums</h2>
        </div>
        <div class="opts" id="kits" role="radiogroup" aria-label="Drum kit"></div>
        <div class="opts" id="patterns" role="radiogroup" aria-label="Drum pattern"></div>
        <label class="knob" for="swing">
            <span>Swing <output id="swing-out" for="swing">15%</output></span>
            <input type="range" id="swing" min="0" max="100" step="1" value="15">
        </label>
    </section>

    <section class="panel" aria-labelledby="loop-h">
        <div class="panel-head">
            <h2 id="loop-h">Test loop</h2>
            <p class="hint">Plays the last 4 chords you tapped</p>
        </div>
        <div class="transport">
            <button type="button" class="key play" id="play" aria-pressed="false">▶ Play</button>
            <div class="strip" id="strip" aria-label="Test loop bars">
                <div class="playhead" aria-hidden="true"></div>
            </div>
        </div>
    </section>

    <footer class="footer">Made by <a href="https://joebieker.com">Joe Bieker</a></footer>
</div>

<dialog class="sheet" id="variant-sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
        <h3 id="sheet-title">Variants</h3>
        <button type="button" class="text-btn" id="sheet-done">Done</button>
    </div>
    <div class="variants" id="variants" role="radiogroup" aria-labelledby="sheet-title"></div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
